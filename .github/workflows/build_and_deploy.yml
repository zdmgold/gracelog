name: GraceLog Build & Deploy
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
env:
  FLUTTER_VERSION: '3.38.1'
jobs:
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate splash screen
        run: dart run flutter_native_splash:create
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Create build output directory
        run: mkdir -p build/symbols/android
      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            2>&1 | tee build/build-log-aab.txt
      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            2>&1 | tee build/build-log-apk.txt
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-android-symbols
          path: build/symbols/android/
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-build-logs
          path: build/build-log-*.txt
  build-android-debug:
    name: Build Android Debug
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'debug'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate splash screen
        run: dart run flutter_native_splash:create
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Create build output directory
        run: mkdir -p build
      - name: Build Android Debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build/build-log-debug.txt
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: gracelog-build-logs
          path: build/build-log-debug.txt
