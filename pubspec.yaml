name: gracelog
description: "Daily gratitude journal with scripture and mood tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.1.11
  intl: ^0.20.2
  local_auth: ^2.1.8
  share_plus: ^13.3.0
  path: ^1.8.3
  image: ^4.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  url_launcher: ^6.2.2
  package_info_plus: ^10.2.1
  uuid: ^4.2.1
  record: ^6.2.1
  audio_service: ^0.18.15
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - app/assets/scriptures_1.json
    - app/assets/scriptures_2.json
    - app/assets/scriptures_3.json
    - app/assets/scriptures_4.json
    - app/assets/scriptures_5.json
    - app/assets/scriptures_6.json
    - app/assets/scriptures_7.json
    - app/assets/sounds/rise_up_with_grace_1.m4a
    - app/assets/sounds/rise_up_with_grace_2.m4a
    - app/assets/sounds/walking_in_faith_1.m4a
    - app/assets/sounds/walking_in_faith_2.m4a
    - app/assets/sounds/walk_in_the_light.m4a
    - app/assets/sounds/grace_of_his_light.m4a
    - app/assets/sounds/the_mark_of_god.m4a
    - app/assets/sounds/gospel_hip_hop_instrumental.m4a
    - app/assets/sounds/gospel_reflections.m4a
    - app/assets/sounds/bible_soundtrack_instrumental.m4a
    - app/assets/sounds/heavens_embrace_piano.m4a
    - app/assets/sounds/messiah_instrumental.m4a
    - app/assets/sounds/christian_worship_piano.m4a

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.6
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#1A140F"
  color_dark: "#1A140F"
  image: assets/splash.png
  image_dark: assets/splash.png
  android_12:
    image: assets/splash.png
    icon_background_color: "#1A140F"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A140F"
  adaptive_icon_foreground: "assets/icon_foreground.png"
