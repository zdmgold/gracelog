name: gracelog
description: "Daily gratitude journal with scripture and mood tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.11
  intl: ^0.19.0
  local_auth: ^2.1.8
  share_plus: ^7.2.1
  path: ^1.8.3
  image: ^4.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  url_launcher: ^6.2.2
  package_info_plus: ^5.0.1
  uuid: ^4.2.1
  record: ^6.2.1
  just_audio: ^0.9.40
  image_picker: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - app/assets/scriptures_1.json
    - app/assets/scriptures_2.json
    - app/assets/scriptures_3.json
    - app/assets/scriptures_4.json
    - app/assets/scriptures_5.json
    - app/assets/scriptures_6.json
    - app/assets/scriptures_7.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.6
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
